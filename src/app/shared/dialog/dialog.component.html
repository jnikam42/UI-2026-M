<mat-dialog-content>
  <h1 *ngIf="Title" mat-dialog-title>{{Title}}</h1>
  <h2 *ngIf="Caption" mat-dialog-title>{{Caption}}</h2>

  <div *ngIf="messageText" mat-dialog-content>{{messageText}}</div>

  <p *ngIf="sessionMsgTitle" class="session-msg-title" [innerHTML]="sessionMsgTitle"></p>
  <p *ngIf="sessionMsgBody" class="session-msg-body" [innerHTML]="sessionMsgBody"></p>
</mat-dialog-content>

<div mat-dialog-actions *ngIf="type === 'confirm'" class="button-group">
  <button mat-button mat-dialog-close class="dialog-btn-no" (click)="cancel()">No</button>
  <button mat-button mat-dialog-close class="dialog-btn-yes" (click)="confirm()">Yes</button>
</div>

<div mat-dialog-actions *ngIf="type !== 'confirm'" class="justify-content-center">
  <button mat-button mat-dialog-close class="dialog-btn-confirm" style="width: 100%" (click)="cancel()">Ok</button>
</div>
